name: Semgrep

# https://semgrep.dev/docs/semgrep-ci/sample-ci-configs/#sample-github-actions-configuration-file
on:
    pull_request_target:
        branches:
            - master
    push:
        branches:
            - master
    schedule:
        # random HH:MM to avoid a load spike on GitHub Actions at 00:00
        - cron: 21 20 * * *

# A new push to a pull request cancels the scan of the previous push.
# Every other run gets its own group per branch and commit, so a push to master is never cancelled or replaced.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
    semgrep:
        name: Scan
        runs-on: ubuntu-latest
        container:
            image: returntocorp/semgrep
        if: (github.triggering_actor != 'dependabot[bot]')
        permissions:
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Public forks do not inherit the parent's SEMGREP_APP_TOKEN secret.
            # Use a community ruleset if the cloud token is absent, and fail if
            # scanning breaks instead of uploading a zero-byte SARIF report.
            - name: Run Semgrep with cloud or community rules
              shell: bash
              env:
                  SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
              run: |
                  set -euo pipefail
                  if [ -n "${SEMGREP_APP_TOKEN}" ]; then
                      semgrep ci --sarif --no-suppress-errors > semgrep.sarif
                  else
                      echo "Cloud token unavailable; running Semgrep community rules"
                      semgrep scan --config p/default --sarif --output semgrep.sarif
                  fi
                  python3 -c 'import json; data=json.load(open("semgrep.sarif", encoding="utf-8")); assert data.get("version") == "2.1.0" and isinstance(data.get("runs"), list), "Invalid SARIF"'
            - name: Upload SARIF file for GitHub Advanced Security Dashboard
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: semgrep.sarif
              if: success()
